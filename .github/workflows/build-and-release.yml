# Build and Release — 打 tag（v*）或手动触发时，在云端 Windows 上用 MSVC
# 编译 x86/x64 两个版本，打包成 zip（DLL 在 zip 根目录，符合 Plugins Admin 要求），
# 并创建 GitHub Release。

name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build DLL
        run: powershell -ExecutionPolicy Bypass -File build.ps1 -Arch ${{ matrix.arch }}

      - name: Package zip (DLL at zip root, as Plugins Admin requires)
        shell: pwsh
        run: |
          Compress-Archive -Path dist/${{ matrix.arch }}/SqlColumnHighlighter.dll `
            -DestinationPath dist/SqlColumnHighlighter-${{ github.ref_name }}-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ matrix.arch }}
          path: dist/SqlColumnHighlighter-${{ github.ref_name }}-${{ matrix.arch }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA-256 (needed for the nppPluginList submission)
        run: |
          cd artifacts
          sha256sum *.zip | tee ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.zip
            SHA256SUMS.txt
          generate_release_notes: true
          
